name: Desplegar a un entorno

# Los pasos de despliegue viven aqui una sola vez y los tres entornos los
# llaman. Con dev, qa y prod repitiendo los mismos cuatro pasos, tarde o
# temprano uno se queda atras cuando se toca otro — y el que se queda atras
# suele ser prod, que es el que menos se toca y mas duele.

on:
  workflow_call:
    inputs:
      entorno:
        description: dev, qa o prod
        required: true
        type: string
      rol:
        description: >-
          ARN del rol OIDC, si viene de una variable de repositorio.
          Opcional: si el environment define AWS_ROLE, esa gana.
        required: false
        type: string
        default: ""
      region:
        required: false
        type: string
        default: eu-south-2

permissions:
  contents: read
  id-token: write        # OIDC: sin claves de acceso guardadas en secretos

jobs:
  desplegar:
    name: ${{ inputs.entorno }}
    runs-on: ubuntu-latest
    # La proteccion (revisores obligatorios) se configura en GitHub por
    # entorno, no aqui. Asi se puede exigir aprobacion para prod sin tocar
    # este fichero.
    environment: ${{ inputs.entorno }}
    steps:
      - uses: actions/checkout@v7

      - name: Recuperar el artefacto construido
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      # El rol se puede configurar de dos maneras y las dos valen:
      #
      #   a) variable AWS_ROLE dentro del environment (dev/qa/prod)
      #   b) variable AWS_ROLE_DEV / _QA / _PROD a nivel de repositorio
      #
      # La (a) sólo se resuelve AQUI, porque es este job el que declara el
      # environment; el job que llama a este workflow no lo declara y por tanto
      # no ve las variables de environment. Por eso se mira aqui y no alli.
      - name: Resolver el rol a asumir
        id: rol
        run: |
          arn="${{ vars.AWS_ROLE }}"
          origen="variable AWS_ROLE del environment ${{ inputs.entorno }}"
          if [ -z "$arn" ]; then
            arn="${{ inputs.rol }}"
            origen="variable de repositorio AWS_ROLE_$(echo '${{ inputs.entorno }}' | tr '[:lower:]' '[:upper:]')"
          fi
          if [ -z "$arn" ]; then
            {
              echo "::error::no hay rol configurado para el entorno ${{ inputs.entorno }}"
              echo "Define UNA de estas dos:"
              echo "  · variable AWS_ROLE dentro del environment '${{ inputs.entorno }}'"
              echo "  · variable AWS_ROLE_$(echo '${{ inputs.entorno }}' | tr '[:lower:]' '[:upper:]') a nivel de repositorio"
              echo "Ver docs/FRONTERA-CON-TERRAFORM.md"
            } >&2
            exit 1
          fi
          echo "arn=$arn" >> "$GITHUB_OUTPUT"
          echo "rol tomado de: $origen"

      # El 'sub' del token es lo que la trust policy compara, y su valor
      # depende de cosas que no se ven desde fuera: si el job declara
      # environment, y si corre dentro de un workflow reutilizable como este.
      # Imprimirlo aqui, en la ruta real, convierte el fallo mas opaco de OIDC
      # —"Assuming role" reintentandose sin decir por que— en una linea que se
      # compara a ojo con la politica.
      #
      # Se imprimen claims, nunca el token: los claims son metadatos de la
      # ejecucion, el token es una credencial.
      - name: Claims del token OIDC
        continue-on-error: true
        run: |
          set -uo pipefail
          respuesta="$(curl -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")" || exit 0
          token="$(echo "$respuesta" | jq -r '.value // empty')"
          [ -z "$token" ] && { echo "no se pudo leer el token"; exit 0; }

          payload="$(echo "$token" | cut -d. -f2)"
          case $(( ${#payload} % 4 )) in
            2) payload="${payload}==" ;;
            3) payload="${payload}=" ;;
          esac
          claims="$(echo "$payload" | tr '_-' '/+' | base64 -d 2>/dev/null)" || exit 0

          sub="$(echo "$claims" | jq -r '.sub')"
          echo "sub = ${sub}"
          echo "aud = $(echo "$claims" | jq -r '.aud')"
          echo ""
          echo "La trust policy del rol tiene que aceptar EXACTAMENTE ese sub."
          {
            echo "### Token OIDC de ${{ inputs.entorno }}"
            echo '```'
            echo "sub = ${sub}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.rol.outputs.arn }}
          aws-region: ${{ inputs.region }}

      - name: Publicar
        run: ./scripts/publish.sh ${{ inputs.entorno }}

      - name: Verificar que lo desplegado coincide con el artefacto
        run: ./scripts/verify.sh ${{ inputs.entorno }}

      - name: Resumen
        if: always()
        run: |
          {
            echo "### ${{ inputs.entorno }}"
            echo ""
            echo "Revision: \`$(jq -r .revision dist/manifiesto.json)\`"
            echo ""
            echo '```json'
            jq .artefactos dist/manifiesto.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
