name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r layer/requirements.txt boto3

      - name: Detectores PCI
        run: python tests/detectores_test.py

      - name: Independencia de las dos implementaciones
        run: python tests/deteccion2_test.py

      - name: Pipeline de extremo a extremo
        run: python tests/e2e_test.py

  scripts:
    name: Scripts de shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning scripts/*.sh

  construccion:
    name: La construccion es reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Que el artefacto sea reproducible es lo que permite afirmar que lo
      # aprobado en qa es exactamente lo que entra en prod. Si deja de serlo,
      # esa afirmacion se cae y hay que enterarse aqui, no en la auditoria.
      - name: Construir dos veces y comparar
        run: |
          ./scripts/build.sh --no-layer
          jq -S .artefactos dist/manifiesto.json > /tmp/a.json
          rm -rf dist
          ./scripts/build.sh --no-layer
          jq -S .artefactos dist/manifiesto.json > /tmp/b.json
          if ! diff /tmp/a.json /tmp/b.json; then
            echo "::error::la construccion no es reproducible"
            exit 1
          fi
          echo "los 6 artefactos son identicos entre construcciones"
