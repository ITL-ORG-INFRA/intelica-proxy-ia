name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r layer/requirements.txt boto3

      # Se corre la suite entera con el mismo lanzador que en local. Antes se
      # enumeraban tres ficheros a mano y uno de ellos ya no existia con ese
      # nombre: el paso fallaba por "no such file", no por una prueba en rojo.
      - name: Todas las pruebas
        run: PYTHON=python ./tests/run.sh

  scripts:
    name: Scripts de shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning scripts/*.sh scripts/lib/*.sh tests/run.sh

  construccion:
    name: La construccion es reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Que el artefacto sea reproducible es lo que permite afirmar que lo
      # aprobado en qa es exactamente lo que entra en prod. Si deja de serlo,
      # esa afirmacion se cae y hay que enterarse aqui, no en la auditoria.
      - name: Construir dos veces y comparar
        run: |
          ./scripts/build.sh --no-layer
          jq -S .artefactos dist/manifiesto.json > /tmp/a.json
          rm -rf dist
          ./scripts/build.sh --no-layer
          jq -S .artefactos dist/manifiesto.json > /tmp/b.json
          if ! diff /tmp/a.json /tmp/b.json; then
            echo "::error::la construccion no es reproducible"
            exit 1
          fi
          echo "los 6 artefactos son identicos entre construcciones"

      # Los nombres de los zip son contrato con publish.sh: publica
      # dist/<funcion>.zip en la Lambda que le corresponde. Si build.sh deja
      # otro nombre, publish.sh muere con "falta dist/x.zip" en pleno
      # despliegue, no aqui.
      - name: Los seis artefactos se llaman como espera publish.sh
        run: |
          for z in sanitizer submitter reconciler fetcher verifier canary; do
            test -f "dist/${z}.zip" || { echo "::error::falta dist/${z}.zip"; exit 1; }
          done
          echo "los seis zip estan y se llaman bien"
